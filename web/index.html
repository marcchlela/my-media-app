<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MyFlix Web</title>
  <link rel="stylesheet" href="/web/style.css" />
</head>
<body data-app-theme="electric-lounge" data-theme="dark">
  <div class="app-shell">
    <header class="navbar">
      <h1 id="homeBtn" class="logo" tabindex="0">MyFlix</h1>
      <div class="nav-actions">
        <div class="mobile-filters">
          <select id="mobileGenreFilter" class="mobile-select">
            <option value="all">All Genres</option>
          </select>
          <select id="mobileSortFilter" class="mobile-select">
            <option value="default">Sort: Default</option>
            <option value="release_desc">Release Date: New to Old</option>
            <option value="release_asc">Release Date: Old to New</option>
            <option value="rating_desc">Highest Rated</option>
            <option value="rating_asc">Lowest Rated</option>
            <option value="runtime_asc">Shortest Runtime</option>
            <option value="runtime_desc">Longest Runtime</option>
          </select>
        </div>
        <input id="searchInput" class="search" type="search" placeholder="Search library..." />
        <button id="movieNightBtn" class="lounge-top-action" type="button" aria-label="Open Movie Night">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9h-9V3Z"/><path d="M15 3.5A8.5 8.5 0 0 1 20.5 9H15V3.5Z"/><circle cx="9" cy="10" r="1.2"/><circle cx="8" cy="15" r="1.2"/><circle cx="13" cy="16" r="1.2"/></svg>
          <span>Movie Night</span>
        </button>
        <button id="suggestionBtn" class="lounge-top-action accent" type="button" aria-label="Suggest a title">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Suggest</span>
        </button>
      </div>
    </header>

    <div class="app-body">
      <aside id="mobileNav" class="sidebar">
        <button data-view="home" class="nav-btn active">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2.5 9.5V7a2 2 0 0 1 2-2h15a2 2 0 0 1 2 2v2.5a2.5 2.5 0 0 0 0 5V17a2 2 0 0 1-2 2h-15a2 2 0 0 1-2-2v-2.5a2.5 2.5 0 0 0 0-5Z"/>
              <path d="M13.5 5v3M13.5 11v2M13.5 16v3"/>
            </svg>
          </span>
          <span class="nav-label">Lobby</span>
        </button>
        <div class="side-divider"></div>
        <button data-view="movies" class="nav-btn">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
              <path d="M7 5v14M17 5v14M3 9h4M3 15h4M17 9h4M17 15h4" fill="none" stroke="currentColor" stroke-width="1.8"/>
            </svg>
          </span>
          <span class="nav-label">Movies</span>
        </button>
        <div class="side-divider"></div>
        <button data-view="shows" class="nav-btn">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
              <path d="m8 2 4 3 4-3M8 22h8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="nav-label">TV Shows</span>
        </button>
        <div class="side-divider"></div>
        <button data-view="settings" class="nav-btn">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="nav-label">Settings</span>
        </button>
        <div class="side-divider"></div>
        <button data-view="account" class="nav-btn">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/>
              <path d="M4 21a8 8 0 0 1 16 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="nav-label">Account</span>
        </button>
      </aside>

      <main class="main">
        <p id="statusText" class="status">Loading library...</p>
        <section id="content"></section>
      </main>
    </div>
  </div>

  <section id="playerView" class="player-view hidden">
    <div class="player-panel">
      <div class="player-header">
        <button id="backBtn" class="ghost-btn icon-back-btn" aria-label="Back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <h2 id="playerTitle"></h2>
      </div>
      <div id="playerStage" class="player-stage">
        <video id="player" playsinline></video>
        <button id="fullscreenBackBtn" class="fullscreen-player-back icon-back-btn" type="button" aria-label="Close player">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="skipIntroBtn" class="player-marker-action hidden" type="button">Skip Intro</button>
        <button id="nextEpisodeBtn" class="player-marker-action next-episode hidden" type="button">Next Episode</button>
        <div id="playerControls" class="player-controls">
          <div class="player-timeline-wrap">
            <input id="timelineRange" class="player-timeline" type="range" min="0" max="1000" value="0" />
          </div>
          <div class="player-control-row">
            <div class="player-left-controls">
              <button id="playPauseBtn" class="player-control-btn primary" type="button" aria-label="Play"></button>
              <button id="skipBackBtn" class="player-control-btn" type="button" aria-label="Go back 5 seconds"></button>
              <button id="skipForwardBtn" class="player-control-btn" type="button" aria-label="Go forward 5 seconds"></button>
            </div>
            <div class="player-center-controls">
              <span id="currentTimeLabel" class="player-time">0:00</span>
              <span id="durationLabel" class="player-time player-time-end">0:00</span>
            </div>
            <div class="player-right-controls">
              <div id="qualityGroup" class="player-quality-group">
                <button id="qualityBtn" class="player-control-btn subtle" type="button" aria-label="Playback quality" aria-expanded="false">
                  <span id="qualityButtonLabel" class="quality-button-label">HD</span>
                </button>
                <div id="qualityMenu" class="player-quality-menu" role="menu" aria-label="Playback quality"></div>
              </div>
              <div class="player-volume-group">
                <button id="muteBtn" class="player-control-btn subtle" type="button" aria-label="Mute"></button>
                <div class="player-range-shell">
                  <input id="volumeRange" class="player-range" type="range" min="0" max="100" value="100" />
                </div>
              </div>
              <button id="fullscreenBtn" class="player-control-btn subtle" type="button" aria-label="Fullscreen"></button>
            </div>
          </div>
        </div>
      </div>
      <p id="playerStatus" class="player-status"></p>
      <div id="subtitleControls" class="subtitle-controls hidden"></div>
    </div>
  </section>

  <script src="/vendor/hls.min.js"></script>
  <script src="/web/app.js"></script>
</body>
</html>
