services:
  myflix:
    build: .
    container_name: myflix
    hostname: myflix
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /data
      MOVIES_DIR: /media/Movies
      TV_SHOWS_DIR: /media/TV Shows
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      REQUIRE_AUTH: ${REQUIRE_AUTH:-false}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      SCAN_ON_STARTUP: ${SCAN_ON_STARTUP:-true}
      TRANSCODE_ACCEL: ${TRANSCODE_ACCEL:-auto}
      TRANSCODE_CONCURRENCY: ${TRANSCODE_CONCURRENCY:-1}
      TRANSCODE_FALLBACK_HEIGHT: ${TRANSCODE_FALLBACK_HEIGHT:-720}
      FFMPEG_PATH: ${FFMPEG_PATH:-ffmpeg}
      FPCALC_PATH: ${FPCALC_PATH:-fpcalc}
      ENABLE_LEGACY_PATH_ROUTES: "false"
    volumes:
      - /srv/myflix/data:/data
      - /srv/media/kingston:/media:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    # Intel/AMD hardware transcoding: uncomment when /dev/dri exists on the host.
    # devices:
    #   - /dev/dri:/dev/dri
